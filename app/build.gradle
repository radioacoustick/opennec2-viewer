plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.radioacoustick.opennec2.viewer'
    compileSdk = 37

    defaultConfig {
        applicationId "com.radioacoustick.opennec2.viewer"
        minSdk = 24
        targetSdk 37
        versionCode = 3
        versionName  = '1.0.2'

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel = 'SYMBOL_TABLE'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).tap {
        configureEach {
            options.compilerArgs << "-Xlint:deprecation"
        }
    }

    aaptOptions {
        // Prevents AAPT from compressing .filmat output.
        noCompress 'filmat'
    }

    sourceSets {
        main {
            assets.srcDir 'src/main/materials'
        }
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    implementation 'androidx.navigation:navigation-fragment:2.10.1'
    implementation 'androidx.navigation:navigation-ui:2.10.1'

    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'net.objecthunter:exp4j:0.4.8'

    implementation project(':nec2core')

    ///noinspection NewerVersionAvailable
    implementation 'com.google.android.filament:filament-android:1.53.0'
    //noinspection NewerVersionAvailable
    implementation 'com.google.android.filament:filament-utils-android:1.53.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

configurations.configureEach {
    resolutionStrategy {
        force 'com.google.android.filament:filament-android:1.53.0'
        force 'com.google.android.filament:filament-utils-android:1.53.0'
    }
}
